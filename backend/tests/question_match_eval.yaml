# Banc « même question ? » (données fictives). Chaque sujet : formulations vues dans d'anciens RFI (train) et
# formulations jamais vues (test). Les sujets « voisins » (1 an / 3 ans, frais de gestion / de performance, création du
# fonds / de la stratégie) doivent rester distincts. Mesure : python -m merlin.match.evaluate
