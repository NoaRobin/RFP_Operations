# Dictionnaire des réponses quantitatives / factuelles d'un RFI.
#
# Chaque fait :
#   scope    : fund (fonds Product Info) | share (part, par ISIN)
#   source   : table.colonne (Product Info) ou jump: <requête nommée dans facts.py>
#   format   : text | number | amount | percent | date | boolean | time
#   keywords : groupes de termes (texte normalisé : minuscules, sans accents). Un groupe correspond si TOUS
#              ses termes sont présents dans la question. Le meilleur groupe donne le score.
#   exclude  : termes qui disqualifient le fait (ex. « part » pour un encours de fonds).
# Les noms de colonnes viennent de catalog/fabric_schema.csv (jamais devinés). Unités des taux : À CONFIRMER
# (une valeur ≤ 0,05 est lue comme une fraction et convertie en %).

facts:
  # ------------------------------------------------------------------ Identité du fonds
  - id: fund.name
    label: Nom du fonds
    scope: fund
    source: pi_out_product_active.Product_Name
    format: text
    keywords: [[nom du fonds], [fund name], [name of the fund], [denomination du fonds], [fund's name], [nom de l'opc], [nom de l opcvm]]
    exclude: [gerant, manager, benchmark, indice, share, part]
