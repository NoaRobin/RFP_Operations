    scope: fund
    source: pi_out_product_active.Legal_Form
    format: text
    keywords: [[forme juridique], [legal form], [legal structure], [structure juridique], [legal status], [vehicle type], [type de vehicule]]
  - id: fund.domicile
    label: Domicile
    scope: fund
    source: pi_out_product_active.Domiciliation
    format: text
    keywords: [[domicile], [domiciliation], [country of domicile], [pays de domiciliation], [fund domicile]]
  - id: fund.umbrella
