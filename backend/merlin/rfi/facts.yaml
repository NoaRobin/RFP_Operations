    source: pi_out_product_active.Creation_Date
    format: date
    keywords: [[date de creation, fonds], [date de lancement, fonds], [fund launch date], [fund inception], [inception date], [launch date], [date de creation], [date de lancement], [date of creation], [fund creation]]
    exclude: [part, share, class]
  - id: fund.base_currency
    label: Devise de référence du fonds
    scope: fund
    source: pi_out_product_active.Accounting_Currency
    format: text
    keywords: [[devise de reference], [base currency], [reference currency], [fund currency], [devise du fonds], [devise de comptabilisation], [accounting currency]]
    exclude: [part, share, class]
  - id: fund.lei
