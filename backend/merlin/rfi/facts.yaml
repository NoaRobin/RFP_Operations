    source: pi_out_product_active.Applicable_UCI_Regulation
    format: text
    keywords: [[ucits], [opcvm], [fia], [aifmd], [regulatory status], [statut reglementaire], [regulation, fund]]
    exclude: [sfdr, article]
  - id: fund.launch_date
    label: Date de création du fonds
