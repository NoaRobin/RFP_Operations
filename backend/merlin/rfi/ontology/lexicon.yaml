# Lexique pivot : questions espagnoles (es) et italiennes (it) traduites mot à mot vers le français de l'ontologie.
#
# La compréhension (understand.py) ne connaît que les termes FR / EN de concepts.yaml et facets.yaml. Plutôt que de
# dupliquer 224 concepts en quatre langues, la question es / it normalisée (minuscules, sans accents) est réécrite
# en français avant l'analyse : « comisión de gestión máxima » → « commission de gestion maximum ».
#   phrases : expressions remplacées d'abord (les plus longues en premier) ;
#   words   : mots isolés remplacés ensuite (frontières de mots, jamais à l'intérieur d'un mot).
# Les cibles doivent être des termes existants de l'ontologie (sinon la traduction n'apporte rien).
# La réponse n'est pas traduite par ce lexique : libellés es / it dans vocabularies.yaml, sinon anglais.

