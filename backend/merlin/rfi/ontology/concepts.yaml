# Ontologie des réponses factuelles d'un RFI / DDQ (fonds et parts).
#
# Un concept = une notion métier qu'un questionnaire peut demander, reliée à UNE source de données vérifiable.
#   id        : identifiant stable (fonds.* / part.* / jump.* / perf.*)
#   label     : « libellé FR | libellé EN »
#   scope     : fund | share (part : nécessite l'ISIN)
#   type      : text | long | enum | bool | percent | number | int | amount | date | time | code | list
#   vocab     : vocabulaire contrôlé (vocabularies.yaml) pour les enum
#   source    : table.colonne (Product Info, vérifiée contre catalog/fabric_schema.csv)
#               ou {fr: table.colonne, en: table.colonne} (texte publié dans chaque langue)
#               ou jump:<mesure> / perf:<mesure> / registration:<mesure> (calculés, voir values.py)
#   terms     : expressions qui désignent le concept (une seule suffit) ; « a & b » = les deux mots, dans n'importe quel ordre
#   require   : au moins un de ces termes doit AUSSI être présent
#   exclude   : termes qui écartent le concept
#   facets    : qualificatifs du concept (facets.yaml) ; une facette contraire dans la question écarte le concept
#   default   : facettes pour lesquelles ce concept est la lecture par défaut quand la question ne précise rien
#   ambiguous : la lecture par défaut reste discutable → jamais rempli automatiquement, toujours proposé « à vérifier »
#   range     : bornes de vraisemblance (en unités affichées) ; hors bornes → aucune réponse
#   validate  : isin | lei | currency
#   transform : negate (booléen inversé) | not_null (présence d'une date / valeur)
#   qualitative_ok : texte réglementaire publié (objectif de gestion…) : accepté même pour « Décrivez… »
#
# Conventions Product Info reprises d'App4everyone (domain/fields.py, README) :
#   - pourcentages en points (1,35 = 1,35 %) — hypothèse partagée, À CONFIRMER avec l'équipe Data ;
#   - booléens « Yes / No / Oui / Non / 1 / 0 » ;
#   - part ↔ fonds : PI_OUT_Share.ProductID = pi_out_product_active.pi_productid.

